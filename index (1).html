function key(p){return p.vendor+"||"+(p.code||p.name)}function change(p,d){let k=key(p);cart[k]=Math.max(0,(cart[k]||0)+d);if(!cart[k])delete cart[k];render()}

function selected(){return Object.entries(cart).map(([k,q])=>({p:products.find(x=>key(x)===k),q})).filter(x=>x.p)}function renderSum(){let a=selected(),vs=[...new Set(a.map(x=>x.p.vendor))];document.getElementById("sumgrid").innerHTML=vs.length?vs.map(v=>`<div class="vendorSum"><h3>${v}</h3>${a.filter(x=>x.p.vendor===v).map(x=>`<div class="line"><span>${x.p.name} <span class="small">${x.p.category}</span></span><b>Qty ${x.q}</b></div>`).join("")}<div class="line"><button class="secondary" onclick='clearV(${JSON.stringify(v)})'>Clear ${v}</button></div></div>`).join(""):'<div class="small">No items selected yet.</div>'}
function clearV(v){Object.keys(cart).filter(k=>k.startsWith(v+"||")).forEach(k=>delete cart[k]);render()}function clearAll(){cart={};render()}
function textFor(v){let buyer=document.getElementById("buyer").value||"Not specified",notes=document.getElementById("notes").value||"None",rows=selected().filter(x=>x.p.vendor===v),l=["CITY CAFE / PRIVATE VENDOR ORDER","Vendor: "+v,"Ordered by: "+buyer,"Date: "+new Date().toLocaleString(),"","ITEMS"];rows.forEach(x=>l.push(x.q+" x "+x.p.name+" | "+x.p.category+(x.p.code?" | Item "+x.p.code:"")));l.push("","NOTES:",notes);return l.join("\n")}
function sendOrders(){let a=selected();if(!a.length){alert("Please add at least one item.");return}let vs=[...new Set(a.map(x=>x.p.vendor))],body=vs.map(textFor).join("\n\n----------------------------------------\n\n"),subject="City Cafe Vendor Orders - "+vs.join(", ");document.getElementById("status").innerHTML='';location.href="mailto:"+encodeURIComponent(EMAIL)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body)}
